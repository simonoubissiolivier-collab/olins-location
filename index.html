<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLINS Locations Cameroun - Logements vérifiés</title>
  <meta name="description" content="Plateforme nationale de location de maisons, appartements et chambres au Cameroun. Annonces vérifiées, confiance garantie.">
  <meta name="theme-color" content="#0A4D3C">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="recaptcha-container"></div>
  
  <header class="header">
    <nav class="nav">
      <a href="/" class="logo">
        <span class="logo-main">OLINS</span>
          <!-- reduire la taille de la police du logo-sub en pourcentage 30%--> 
          <span class="logo-sub" style="font-size:70%;">Locations Cameroun</span>
      </a>
      
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      
      <div class="nav-links" id="navLinks">
        <a href="/">Accueil</a>
        <a href="comment-ca-marche.html">Comment ça marche</a>
        <a href="aide-contact.html">Aide & Contact</a>
        <a href="#" id="loginBtn" class="btn-outline">Connexion</a>
        <a href="#" id="registerBtn" class="btn-primary">S'inscrire</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Trouvez votre logement en toute <span>confiance</span></h1>
        <p class="hero-subtitle">Des milliers de maisons, appartements et chambres vérifiés partout au Cameroun</p>
        
        <div class="search-card">
          <form id="searchForm" class="search-form">
            <div class="search-row">
              <select id="searchRegion" class="search-input" required>
                <option value="">📍 Région</option>
                <option value="Adamaoua">Adamaoua</option>
                <option value="Centre">Centre</option>
                <option value="Est">Est</option>
                <option value="Extrême-Nord">Extrême-Nord</option>
                <option value="Littoral">Littoral</option>
                <option value="Nord">Nord</option>
                <option value="Nord-Ouest">Nord-Ouest</option>
                <option value="Ouest">Ouest</option>
                <option value="Sud">Sud</option>
                <option value="Sud-Ouest">Sud-Ouest</option>
              </select>
              
              <input type="text" id="searchCity" class="search-input" placeholder="🏙️ Ville (ex: Douala, Yaoundé...)" required>
              
              <select id="searchType" class="search-input">
                <option value="">🏠 Type de bien</option>
                <option value="Maison">Maison</option>
                <option value="Appartement">Appartement</option>
                <option value="Chambre">Chambre</option>
                <option value="Studio">Studio</option>
                <option value="Mini-cité">Mini-cité</option>
              </select>
              
              <select id="searchMaxPrice" class="search-input">
                <option value="">💰 Budget max (FCFA)</option>
                <option value="25000">25 000 FCFA</option>
                <option value="50000">50 000 FCFA</option>
                <option value="100000">100 000 FCFA</option>
                <option value="200000">200 000 FCFA</option>
                <option value="500000">500 000 FCFA</option>
                <option value="1000000">+ 1 000 000 FCFA</option>
              </select>
              
              <button type="submit" class="btn-search">🔍 Rechercher</button>
            </div>
          </form>
        </div>
        ...
